    <style>
      :root {
        --bg: #f3f7f2;
        --bg-deep: #e4efe3;
        --surface: #ffffff;
        --ink: #0f1a12;
        --muted: #5a6b5e;
        --primary: #006b2c;
        --primary-soft: #0be668;
        --primary-container: #8bdb85;
        --outline: #c5d4c6;
        --radius: 16px;
        --shadow: 0 12px 40px rgba(15, 26, 18, 0.08);
        --max: 760px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(11, 230, 104, 0.18), transparent 55%),
          radial-gradient(900px 420px at 100% 0%, rgba(0, 107, 44, 0.12), transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        line-height: 1.55;
      }

      a {
        color: var(--primary);
      }

      .shell {
        width: min(100% - 2rem, var(--max));
        margin: 0 auto;
        padding: 2.5rem 0 4rem;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.75rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
        color: inherit;
      }

      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, var(--primary-soft), var(--primary));
        color: #04140a;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 1.05rem;
        box-shadow: 0 8px 20px rgba(0, 107, 44, 0.25);
      }

      .brand-copy strong {
        display: block;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .brand-copy span {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .lang {
        display: inline-flex;
        padding: 0.25rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--outline);
        gap: 0.15rem;
      }

      .lang button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 0.45rem 0.85rem;
        border-radius: 999px;
        cursor: pointer;
      }

      .lang button[aria-pressed="true"] {
        background: var(--primary);
        color: #fff;
      }

      .hero {
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: calc(var(--radius) + 4px);
        box-shadow: var(--shadow);
        padding: 1.75rem 1.5rem 1.5rem;
        margin-bottom: 1.25rem;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0 0 0.75rem;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary-soft);
        box-shadow: 0 0 0 4px rgba(11, 230, 104, 0.2);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: clamp(1.7rem, 4vw, 2.35rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }

      .lede {
        margin: 0;
        color: var(--muted);
        max-width: 52ch;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 1.25rem;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        background: rgba(0, 107, 44, 0.08);
        color: var(--primary);
        font-size: 0.8rem;
        font-weight: 700;
        border: 1px solid rgba(0, 107, 44, 0.15);
      }

      .toc {
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid var(--outline);
        border-radius: var(--radius);
        padding: 1rem 1.15rem;
        margin-bottom: 1.25rem;
      }

      .toc h2 {
        margin: 0 0 0.65rem;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .toc ol {
        margin: 0;
        padding-left: 1.15rem;
        columns: 1;
        gap: 1.5rem;
      }

      @media (min-width: 640px) {
        .toc ol {
          columns: 2;
        }
      }

      .toc a {
        color: var(--ink);
        text-decoration: none;
        font-size: 0.92rem;
      }

      .toc a:hover {
        color: var(--primary);
        text-decoration: underline;
      }

      .toc li {
        break-inside: avoid;
        margin: 0.25rem 0;
      }

      article {
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: calc(var(--radius) + 4px);
        box-shadow: var(--shadow);
        padding: 0.5rem 0;
      }

      section {
        padding: 1.35rem 1.5rem;
        border-bottom: 1px solid var(--outline);
      }

      section:last-child {
        border-bottom: 0;
      }

      section h2 {
        margin: 0 0 0.75rem;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--primary);
      }

      section p {
        margin: 0 0 0.75rem;
        color: #243028;
      }

      section p:last-child {
        margin-bottom: 0;
      }

      footer {
        margin-top: 1.75rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      footer a {
        font-weight: 700;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>

      function slugify(title) {
        return title
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      }

      function render(lang) {
        const data = COPY[lang];
        document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
        document.title =
          lang === "en"
            ? "CtGrana — Terms of Use and Privacy"
            : "CtGrana — Termos de Uso e Privacidade";

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (data[key]) el.textContent = data[key];
        });

        const toc = document.getElementById("toc-list");
        const content = document.getElementById("content");
        toc.innerHTML = "";
        content.innerHTML = "";

        data.sections.forEach((section) => {
          const id = slugify(section.title);
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "#" + id;
          a.textContent = section.title;
          li.appendChild(a);
          toc.appendChild(li);

          const sec = document.createElement("section");
          sec.id = id;
          const h2 = document.createElement("h2");
          h2.textContent = section.title;
          sec.appendChild(h2);
          section.paragraphs.forEach((text) => {
            const p = document.createElement("p");
            p.textContent = text;
            sec.appendChild(p);
          });
          content.appendChild(sec);
        });

        document.getElementById("btn-pt").setAttribute("aria-pressed", String(lang === "pt-BR"));
        document.getElementById("btn-en").setAttribute("aria-pressed", String(lang === "en"));
      }

      document.getElementById("btn-pt").addEventListener("click", () => render("pt-BR"));
      document.getElementById("btn-en").addEventListener("click", () => render("en"));
      document.getElementById("year").textContent = String(new Date().getFullYear());
      render("pt-BR");
    </script>
  </body>
